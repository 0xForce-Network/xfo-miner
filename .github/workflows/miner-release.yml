name: miner-release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.0 or v1.1.0). Empty means infer from tag.'
        required: false
      min_version:
        description: 'Minimum supported version for forced OTA upgrade (e.g. 1.0.0)'
        required: true
        default: '0.1.0'
      release_notes:
        description: 'Release notes shown in latest.json'
        required: false
        default: 'Automated miner release'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    concurrency:
      group: miner-release-${{ github.ref_name || github.event.inputs.version || github.run_id }}
      cancel-in-progress: true

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node (for JSON generation)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_MIN_VERSION="0.1.0"
          DEFAULT_RELEASE_NOTES="Automated miner release"

          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [[ -n "${INPUT_VERSION}" ]]; then
            RAW_VERSION="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          else
            echo "workflow_dispatch without version input and no tag ref; cannot infer version" >&2
            exit 1
          fi

          VERSION="${RAW_VERSION#v}"
          RELEASE_TAG="v${VERSION}"
          PREFIX="releases/${RELEASE_TAG}"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          INPUT_MIN_VERSION="${{ github.event.inputs.min_version }}"
          if [[ -n "${INPUT_MIN_VERSION}" ]]; then
            MIN_VERSION="${INPUT_MIN_VERSION}"
          else
            MIN_VERSION="${DEFAULT_MIN_VERSION}"
          fi

          INPUT_RELEASE_NOTES="${{ github.event.inputs.release_notes }}"
          RELEASE_BODY="${{ github.event.release.body }}"
          if [[ -n "${INPUT_RELEASE_NOTES}" ]]; then
            RELEASE_NOTES="${INPUT_RELEASE_NOTES}"
          elif [[ -n "${RELEASE_BODY}" ]]; then
            RELEASE_NOTES="${RELEASE_BODY}"
          else
            RELEASE_NOTES="${DEFAULT_RELEASE_NOTES}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "min_version=${MIN_VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "release_notes<<EOF"
            printf '%s\n' "${RELEASE_NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and package binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/packages

          VERSION="${{ steps.meta.outputs.version }}"

          build_one() {
            local GOOS="$1"
            local GOARCH="$2"
            local PLATFORM_KEY="${GOOS}-${GOARCH}"
            local BIN_NAME="xfo-miner"
            local RAW_BIN="dist/${BIN_NAME}-${PLATFORM_KEY}"
            local ARCHIVE_EPOCH="1970-01-01 00:00:00Z"

            if [[ "${GOOS}" == "windows" ]]; then
              RAW_BIN+=".exe"
            fi

            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${RAW_BIN}" \
              ./cmd/xfo-miner

            touch -d "${ARCHIVE_EPOCH}" "${RAW_BIN}"

            if [[ "${GOOS}" == "windows" ]]; then
              local ARCHIVE="xfo-miner-${PLATFORM_KEY}.zip"
              (cd dist && zip -X -q -j "packages/${ARCHIVE}" "$(basename "${RAW_BIN}")")
            else
              local ARCHIVE="xfo-miner-${PLATFORM_KEY}.tar.gz"
              (cd dist && tar \
                --sort=name \
                --mtime="${ARCHIVE_EPOCH}" \
                --owner=0 \
                --group=0 \
                --numeric-owner \
                -czf "packages/${ARCHIVE}" "$(basename "${RAW_BIN}")")
            fi
          }

          build_one linux amd64
          build_one linux arm64
          build_one windows amd64
          build_one darwin amd64
          build_one darwin arm64

      - name: Generate latest.json manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          PREFIX="${{ steps.meta.outputs.prefix }}"

          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');

          const version = process.env.VERSION;
          const minVersion = process.env.MIN_VERSION;
          const releaseNotes = process.env.RELEASE_NOTES;
          const prefix = process.env.PREFIX;

          const packagesDir = path.join('dist', 'packages');
          const files = fs.readdirSync(packagesDir).sort();
          const assets = {};

          for (const file of files) {
            const fullPath = path.join(packagesDir, file);
            const buf = fs.readFileSync(fullPath);
            const checksum = crypto.createHash('sha256').update(buf).digest('hex');

            const m = file.match(/^xfo-miner-([a-z]+-[a-z0-9_]+)\.(tar\.gz|zip)$/i);
            if (!m) continue;
            const platformKey = m[1];

            assets[platformKey] = {
              download_url: `https://update.xfo.network/${prefix}/${file}`,
              checksum,
              filename: file,
            };
          }

          const manifest = {
            latest_version: version,
            min_version: minVersion,
            release_notes: releaseNotes,
            assets,
          };

          fs.writeFileSync(path.join('dist', 'latest.json'), JSON.stringify(manifest, null, 2) + '\n');
          NODE
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MIN_VERSION: ${{ steps.meta.outputs.min_version }}
          RELEASE_NOTES: ${{ steps.meta.outputs.release_notes }}
          PREFIX: ${{ steps.meta.outputs.prefix }}

      - name: Upload release artifacts to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          ENDPOINT="${{ steps.meta.outputs.endpoint }}"
          PREFIX="${{ steps.meta.outputs.prefix }}"

          aws s3 cp dist/packages "s3://${R2_BUCKET}/${PREFIX}/" \
            --recursive \
            --endpoint-url "${ENDPOINT}" \
            --cache-control "no-store" \
            --only-show-errors

          aws s3 cp dist/latest.json "s3://${R2_BUCKET}/releases/latest.json" \
            --endpoint-url "${ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "no-store" \
            --only-show-errors

      - name: Upload build outputs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfo-miner-release-${{ steps.meta.outputs.release_tag }}
          path: |
            dist/packages/*
            dist/latest.json

      - name: Validate public release surface
        shell: bash
        run: |
          set -euo pipefail

          manifest_url="https://update.xfo.network/releases/latest.json"
          prefix="https://update.xfo.network/releases/${{ steps.meta.outputs.release_tag }}/"
          expected_version="${{ steps.meta.outputs.version }}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          echo "Fetching manifest: ${manifest_url}"
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 \
            "${manifest_url}" -o "${tmpdir}/latest.json"

          python3 - <<'PY' "${tmpdir}/latest.json" "${expected_version}" "${prefix}"
import json
import hashlib
import sys
from pathlib import Path
from urllib.request import Request, urlopen

manifest_path = Path(sys.argv[1])
expected_version = sys.argv[2]
expected_prefix = sys.argv[3]

with manifest_path.open('r', encoding='utf-8') as f:
    manifest = json.load(f)

if manifest.get('latest_version') != expected_version:
    raise SystemExit(f"latest_version mismatch: got {manifest.get('latest_version')!r}, want {expected_version!r}")

assets = manifest.get('assets')
if not isinstance(assets, dict):
    raise SystemExit('assets missing or not an object')

expected = {
    'linux-amd64': 'xfo-miner-linux-amd64.tar.gz',
    'linux-arm64': 'xfo-miner-linux-arm64.tar.gz',
    'windows-amd64': 'xfo-miner-windows-amd64.zip',
    'darwin-amd64': 'xfo-miner-darwin-amd64.tar.gz',
    'darwin-arm64': 'xfo-miner-darwin-arm64.tar.gz',
}

rows = []
failed = False
for platform, filename in expected.items():
    asset = assets.get(platform)
    if not isinstance(asset, dict):
        rows.append((platform, filename, 'FAIL', 'FAIL', 'missing asset'))
        failed = True
        continue

    url = asset.get('download_url', '')
    checksum = asset.get('checksum', '')
    got_filename = asset.get('filename', '')
    notes = []

    if got_filename != filename:
        notes.append(f'filename mismatch (got {got_filename!r}, want {filename!r})')

    if not url.startswith(expected_prefix):
        notes.append(f'url prefix mismatch (got {url!r})')

    if not checksum:
        notes.append('checksum empty')

    if notes:
        rows.append((platform, got_filename or filename, 'FAIL', 'FAIL', '; '.join(notes)))
        failed = True
        continue

    req = Request(url, headers={'User-Agent': 'xfo-miner-release-validator/1.0'})
    with urlopen(req, timeout=60) as resp:
        body = resp.read()
    got = hashlib.sha256(body).hexdigest()
    if got != checksum:
        rows.append((platform, filename, 'PASS', 'FAIL', f'checksum mismatch (got {got}, want {checksum})'))
        failed = True
        continue

    rows.append((platform, filename, 'PASS', 'PASS', ''))

print('PUBLIC RELEASE VALIDATION')
print('platform         filename                      url   sha256  notes')
for platform, filename, url_ok, sum_ok, notes in rows:
    print(f'{platform:<15} {filename:<28} {url_ok:<5} {sum_ok:<6} {notes}')

if failed:
    raise SystemExit(1)
PY

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: xfo-miner ${{ steps.meta.outputs.release_tag }}
          body: ${{ steps.meta.outputs.release_notes }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          append_body: false
          make_latest: true
          generate_release_notes: false
          files: |
            dist/packages/*
            dist/latest.json
